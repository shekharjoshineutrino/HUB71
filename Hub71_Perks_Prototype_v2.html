<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub71 Perks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0547FF; --blue-2:#0038D6; --blue-wash:#EFF3FF; --blue-line:#D3E0FF;
  --ink:#0B0B0C; --ink-2:#4A4D55; --ink-3:#86898F;
  --wash:#F5F5F7; --line:#E4E4E7; --paper:#FFF;
  --green:#0E7A5F; --green-wash:#EAF6F1;
  --r-xl:22px; --r-lg:16px; --r:11px; --r-sm:7px;
  --pad:clamp(20px,5vw,60px);
  --max:1120px;
  --ez:cubic-bezier(.32,.08,.24,1);
  --disp:'Space Grotesk','Inter',-apple-system,sans-serif;
  --ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--ui);background:var(--paper);color:var(--ink);
  font-size:16px;line-height:1.6;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}
.tab{font-variant-numeric:tabular-nums}

/* reveal */
.js-on .rv{opacity:0;transform:translateY(18px)}
.js-on .rv.in{opacity:1;transform:none;transition:opacity .7s var(--ez),transform .7s var(--ez)}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js-on .rv{opacity:1!important;transform:none!important;transition:none!important}
  *{animation:none!important}
}

/* ---------- prototype bar ---------- */
.demo{
  position:sticky;top:0;z-index:70;background:#0B0B0C;color:#fff;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:8px var(--pad);font-size:11.5px;
}
.demo .t{background:#fff;color:#0B0B0C;font-weight:700;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:100px}
.demo .m{color:#8C9099}
.demo .sp{flex:1}
.roles{display:flex;gap:2px;background:#1B1C20;border-radius:100px;padding:3px}
.roles button{padding:5px 15px;border-radius:100px;font-size:11.5px;font-weight:500;
  color:#8C9099;transition:.2s var(--ez)}
.roles button[aria-selected=true]{background:#fff;color:#0B0B0C;font-weight:600}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06)}
.navin{max-width:var(--max);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad);
  height:52px;display:flex;align-items:center;gap:30px}
.logo{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:-.03em;color:var(--blue)}
.logo span{color:var(--ink);font-weight:500;margin-left:7px;font-family:var(--ui);
  font-size:14px;letter-spacing:-.01em}
.nlinks{display:flex;gap:26px;margin-left:auto;font-size:13.5px;color:var(--ink-2)}
.nlinks button{position:relative;padding:2px 0;transition:color .2s}
.nlinks button:hover{color:var(--ink)}
.nlinks button.on{color:var(--ink);font-weight:500}
.nlinks button.on:after{content:"";position:absolute;left:0;right:0;bottom:-17px;
  height:1.5px;background:var(--ink)}
.avatar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.avatar i{width:25px;height:25px;border-radius:50%;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:10.5px;font-weight:600;font-style:normal}

.wrap{max-width:var(--max);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.narrow{max-width:800px}

/* ---------- hero ---------- */
.hero{padding-top:clamp(66px,11vw,132px);padding-bottom:clamp(30px,4vw,50px);text-align:center}
.kicker{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--blue);margin-bottom:22px}
.hero h1{font-family:var(--disp);font-weight:600;
  font-size:clamp(38px,6.4vw,74px);line-height:1.02;letter-spacing:-.042em;
  max-width:17ch;margin:0 auto}
.hero .lede{margin:24px auto 0;max-width:50ch;font-size:clamp(16px,1.7vw,19px);
  line-height:1.55;color:var(--ink-2)}

/* runway — the signature */
.runway{max-width:640px;margin:clamp(44px,6vw,68px) auto 0;
  background:var(--wash);border-radius:var(--r-xl);
  padding:clamp(26px,3.4vw,38px) clamp(24px,3.4vw,40px)}
.rwtop{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.rwtop .l{text-align:left}
.rwtop .lb{font-size:12px;color:var(--ink-3);margin-bottom:5px}
.rwtop .big{font-family:var(--disp);font-weight:700;
  font-size:clamp(32px,4.6vw,50px);letter-spacing:-.045em;line-height:1}
.rwtop .r{text-align:right}
.rwtop .r .lb{font-size:12px;color:var(--ink-3);margin-bottom:5px}
.rwtop .r b{font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:-.03em}
.meter{height:5px;background:#E1E1E5;border-radius:100px;overflow:hidden}
.meter i{display:block;height:5px;background:var(--blue);border-radius:100px;
  width:0;transition:width 1.5s var(--ez) .25s}
.rwfoot{display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;color:var(--ink-3)}

/* ---------- section head ---------- */
.shead{padding-top:clamp(64px,9vw,110px);padding-bottom:26px;text-align:center}
.shead h2{font-family:var(--disp);font-weight:600;font-size:clamp(26px,3.6vw,42px);
  letter-spacing:-.038em;line-height:1.1}
.shead p{margin:12px auto 0;max-width:48ch;font-size:16px;color:var(--ink-2)}
.shead.left{text-align:left}
.shead.left p{margin-left:0}

/* ---------- category cards ---------- */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:20px}
.cat{background:var(--wash);border-radius:var(--r-xl);padding:26px 26px 22px;
  cursor:pointer;transition:transform .45s var(--ez),background .35s var(--ez);
  display:flex;flex-direction:column;min-height:196px;text-align:left}
.cat:hover{transform:translateY(-5px);background:#EFEFF2}
.cat .idx{font-family:var(--disp);font-size:11.5px;font-weight:600;color:var(--ink-3);
  letter-spacing:.06em;margin-bottom:auto}
.cat h3{font-family:var(--disp);font-weight:600;font-size:22px;letter-spacing:-.03em;
  line-height:1.14;margin:34px 0 8px}
.cat p{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.cat .foot{display:flex;align-items:center;justify-content:space-between;
  margin-top:18px;padding-top:15px;border-top:1px solid rgba(0,0,0,.07)}
.cat .val{font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:-.025em}
.cat .cnt{font-size:12px;color:var(--ink-3)}

/* ---------- feature ---------- */
.feat{background:var(--wash);border-radius:var(--r-xl);overflow:hidden;
  display:grid;grid-template-columns:1fr 1fr;cursor:pointer;
  transition:transform .45s var(--ez)}
.feat:hover{transform:translateY(-4px)}
.feat .fl{padding:clamp(34px,4.6vw,60px);display:flex;flex-direction:column;justify-content:center}
.feat .badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;
  color:var(--ink-2);margin-bottom:26px;align-self:flex-start}
.feat .fval{font-family:var(--disp);font-weight:700;
  font-size:clamp(44px,6.6vw,82px);letter-spacing:-.05em;line-height:.94}
.feat .funit{font-size:15px;color:var(--ink-2);margin-top:12px}
.feat .fr{background:var(--paper);padding:clamp(34px,4.6vw,60px);
  display:flex;flex-direction:column;justify-content:center}
.feat .fr h3{font-family:var(--disp);font-weight:600;font-size:clamp(20px,2.3vw,27px);
  letter-spacing:-.032em;line-height:1.18;margin-bottom:14px}
.feat .fr p{font-size:15px;color:var(--ink-2);line-height:1.6}
.feat .go{display:inline-flex;align-items:center;gap:7px;margin-top:24px;
  font-size:14px;font-weight:500;color:var(--blue)}
.feat:hover .go .ar{transform:translateX(4px)}
.go .ar{transition:transform .3s var(--ez)}

/* ---------- offer rows ---------- */
.rowset{margin-top:6px}
.row{display:grid;grid-template-columns:44px 1fr auto 18px;gap:20px;align-items:center;
  padding-top:19px;padding-bottom:19px;border-bottom:1px solid var(--line);
  cursor:pointer;position:relative;transition:padding-left .35s var(--ez)}
.row:first-child{border-top:1px solid var(--line)}
.row:hover{padding-left:10px}
.row:hover .rar{transform:translateX(4px);color:var(--blue)}
.mk{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  font-family:var(--disp);font-size:16px;font-weight:600;color:#fff;flex:none}
.rn{font-size:15.5px;font-weight:500;letter-spacing:-.015em}
.rd{font-size:13.5px;color:var(--ink-2);margin-top:1px}
.rv2{text-align:right;white-space:nowrap}
.rv2 b{font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:-.035em;
  display:block;line-height:1.2}
.rv2 span{font-size:12px;color:var(--ink-3)}
.rar{color:#C4C6CC;transition:transform .3s var(--ez),color .3s;text-align:right}
.gl{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding-top:38px;padding-bottom:12px}

/* ---------- filters ---------- */
.fbar{position:sticky;top:52px;z-index:30;background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);margin-bottom:8px}
.fbarin{max-width:var(--max);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad);
  display:flex;gap:8px;overflow-x:auto;padding-top:13px;padding-bottom:13px;scrollbar-width:none}
.fbarin::-webkit-scrollbar{display:none}
.chip{font-size:13px;color:var(--ink-2);background:var(--wash);padding:7px 15px;
  border-radius:100px;white-space:nowrap;transition:.25s var(--ez)}
.chip:hover{background:#EBEBEF}
.chip.on{background:var(--ink);color:#fff}

/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);
  padding-top:26px;transition:color .2s}
.back:hover{color:var(--blue)}
.dhero{text-align:center;padding-top:clamp(34px,4.6vw,58px);padding-bottom:clamp(30px,4vw,46px)}
.dhero .mk{width:66px;height:66px;border-radius:18px;font-size:24px;margin:0 auto 24px}
.dhero h1{font-family:var(--disp);font-weight:600;font-size:clamp(32px,4.6vw,56px);
  letter-spacing:-.042em;line-height:1.04}
.dhero .sub{margin:16px auto 0;max-width:46ch;font-size:clamp(16px,1.7vw,18px);color:var(--ink-2)}
.dhero .social{display:inline-flex;align-items:center;gap:8px;margin-top:22px;
  font-size:12.5px;color:var(--ink-2);background:var(--wash);padding:7px 15px;border-radius:100px}
.dhero .social i{width:6px;height:6px;border-radius:50%;background:var(--green);font-style:normal}

.dgrid{display:grid;grid-template-columns:1fr 316px;gap:clamp(30px,5vw,64px);
  padding-bottom:90px;align-items:start}
.blk{padding-top:32px;padding-bottom:6px;border-top:1px solid var(--line)}
.blk .bl{font-size:12px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--blue);margin-bottom:13px}
.blk p{font-size:16px;color:var(--ink-2);line-height:1.68;max-width:60ch}
.blk ol{list-style:none;counter-reset:s;margin-top:6px}
.blk ol li{counter-increment:s;position:relative;padding-left:36px;margin-bottom:14px;
  font-size:16px;color:var(--ink-2);line-height:1.6}
.blk ol li:before{content:counter(s);position:absolute;left:0;top:2px;width:23px;height:23px;
  border-radius:50%;background:var(--blue-wash);color:var(--blue);font-family:var(--disp);
  font-size:12px;font-weight:600;display:grid;place-items:center}

.claim{position:sticky;top:74px;background:var(--wash);border-radius:var(--r-xl);
  padding:28px 26px 24px;text-align:center}
.claim .cl{font-size:12px;color:var(--ink-3);margin-bottom:9px}
.claim .cv{font-family:var(--disp);font-weight:700;font-size:clamp(32px,3.6vw,42px);
  letter-spacing:-.045em;line-height:1}
.claim .cu{font-size:13.5px;color:var(--ink-2);margin-top:8px;
  padding-bottom:22px;border-bottom:1px solid rgba(0,0,0,.08);margin-bottom:20px}
.btn{display:block;width:100%;text-align:center;background:var(--blue);color:#fff;
  font-size:15px;font-weight:500;padding:13px;border-radius:100px;
  transition:background .25s,transform .25s var(--ez)}
.btn:hover{background:var(--blue-2);transform:scale(1.015)}
.btn:active{transform:scale(.985)}
.btn.g{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.g:hover{background:#FAFAFB}
.claim .hint{font-size:12.5px;color:var(--ink-3);margin-top:12px}
.dmeta{margin-top:22px;text-align:left}
.dmeta .mi{display:flex;justify-content:space-between;gap:14px;font-size:13.5px;
  padding-top:12px;padding-bottom:12px;border-top:1px solid rgba(0,0,0,.08)}
.dmeta .mi span{color:var(--ink-3)}
.dmeta .mi b{font-weight:500;text-align:right}

/* ---------- my perks ---------- */
.phead{padding-top:clamp(48px,6vw,80px);padding-bottom:30px}
.phead h1{font-family:var(--disp);font-weight:600;font-size:clamp(30px,4vw,48px);
  letter-spacing:-.04em;line-height:1.06}
.phead p{margin-top:14px;max-width:56ch;font-size:16.5px;color:var(--ink-2)}

.jcard{background:var(--wash);border-radius:var(--r-xl);padding:24px 26px;margin-bottom:12px;
  display:grid;grid-template-columns:44px 1fr 250px;gap:22px;align-items:center;
  transition:transform .4s var(--ez)}
.jcard:hover{transform:translateY(-3px)}
.jn{font-size:16px;font-weight:500;letter-spacing:-.015em}
.jd{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.jstate{text-align:right}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;
  padding:5px 13px;border-radius:100px;background:var(--paper)}
.pill i{width:6px;height:6px;border-radius:50%;font-style:normal}
.p-req i{background:var(--ink-3)} .p-req{color:var(--ink-2)}
.p-app i{background:var(--blue)} .p-app{color:var(--blue)}
.p-red i{background:var(--green)} .p-red{color:var(--green);background:var(--green-wash)}
.p-dec i{background:#C4C6CC} .p-dec{color:var(--ink-3)}
.steps{display:flex;gap:4px;margin-top:12px;justify-content:flex-end}
.steps i{height:3px;width:32px;border-radius:2px;background:#DEDEE2;display:block}
.steps i.on{background:var(--blue)} .steps i.done{background:var(--green)}
.jdt{font-size:12px;color:var(--ink-3);margin-top:9px}

/* ---------- admin ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--wash);border-radius:var(--r-lg);padding:22px 24px}
.kpi span{font-size:12.5px;color:var(--ink-3);display:block;margin-bottom:9px}
.kpi b{font-family:var(--disp);font-size:32px;font-weight:600;letter-spacing:-.04em;
  display:block;line-height:1}
.kpi i{font-style:normal;font-size:12.5px;color:var(--green);font-weight:500;
  display:block;margin-top:8px}
.kpi i.f{color:var(--ink-3)}

.cards2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:14px}
.card{background:var(--wash);border-radius:var(--r-xl);padding:26px 28px}
.card.w{background:var(--paper);border:1px solid var(--line)}
.card h3{font-family:var(--disp);font-weight:600;font-size:18px;letter-spacing:-.028em}
.card .ch{font-size:13px;color:var(--ink-2);margin-top:4px;margin-bottom:22px}

.bars{display:flex;flex-direction:column;gap:15px}
.bar{display:grid;grid-template-columns:118px 1fr 42px;gap:14px;align-items:center;font-size:13.5px}
.bar .bn{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bt{display:block;height:6px;background:#E1E1E5;border-radius:100px;overflow:hidden}
.bar .bf{display:block;height:6px;background:var(--blue);border-radius:100px;
  width:0;transition:width 1.1s var(--ez)}
.bar .bv{text-align:right;font-family:var(--disp);font-weight:600;letter-spacing:-.02em}

.funnel{display:flex;flex-direction:column;gap:5px}
.fs{display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:var(--paper);border-radius:var(--r);padding:15px 18px;font-size:14px}
.fs b{font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:-.03em}
.fs .pc{font-size:12px;color:var(--ink-3);margin-left:9px;font-family:var(--ui);font-weight:400}
.fa{text-align:center;color:#C4C6CC;font-size:12px;line-height:1}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding-right:14px;padding-bottom:13px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding-top:15px;padding-bottom:15px;padding-right:14px;
  border-bottom:1px solid var(--line);color:var(--ink-2)}
td b{font-weight:500;color:var(--ink)}
td.n{font-family:var(--disp);font-weight:600;color:var(--ink);letter-spacing:-.02em}

/* ---------- approvals ---------- */
.apr{background:var(--wash);border-radius:var(--r-xl);padding:24px 26px;margin-bottom:12px}
.aprh{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.aprh .an{font-size:16px;font-weight:500;letter-spacing:-.015em}
.aprh .at{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.diff>div{background:var(--paper);border-radius:var(--r);padding:15px 17px}
.diff .dl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:7px}
.diff .old{color:var(--ink-3);text-decoration:line-through;font-size:14px}
.diff .new{color:var(--ink);font-weight:500;font-size:14px}
.acts{display:flex;gap:9px}
.acts button{font-size:14px;font-weight:500;padding:10px 22px;border-radius:100px;
  transition:.25s var(--ez)}
.acc{background:var(--blue);color:#fff}
.acc:hover{background:var(--blue-2)}
.rej{background:var(--paper);color:var(--ink-2)}
.rej:hover{background:#FAFAFB}

/* ---------- form ---------- */
.notice{display:flex;align-items:center;gap:11px;background:var(--blue-wash);
  border-radius:var(--r-lg);padding:15px 19px;font-size:14px;color:#1E2B4D;margin-bottom:10px}
.notice i{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none;font-style:normal}
.fld{padding-top:22px;padding-bottom:4px;border-top:1px solid var(--line)}
.fld:first-of-type{border-top:none}
.fld label{font-size:13px;font-weight:500;color:var(--ink-2);display:block;margin-bottom:9px}
.fld input,.fld textarea{width:100%;font:inherit;font-size:15px;background:var(--wash);
  border:1px solid transparent;border-radius:var(--r);padding:12px 15px;color:var(--ink);
  transition:.2s;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:none;background:var(--paper);border-color:var(--blue)}
.fld .h{font-size:12.5px;color:var(--ink-3);margin-top:8px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(11,11,12,.4);backdrop-filter:blur(6px);
  z-index:90;display:grid;place-items:center;padding:20px;animation:fade .3s var(--ez)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:26px;max-width:430px;width:100%;
  padding:34px 34px 28px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.18);
  animation:pop .45s var(--ez)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
.modal .mi{width:50px;height:50px;border-radius:50%;background:var(--blue-wash);
  display:grid;place-items:center;margin:0 auto 20px}
.modal h3{font-family:var(--disp);font-weight:600;font-size:22px;letter-spacing:-.03em;margin-bottom:10px}
.modal p{font-size:15px;color:var(--ink-2);line-height:1.6;margin-bottom:22px}
.code{background:var(--wash);border-radius:var(--r);padding:16px;
  font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:.05em;margin-bottom:22px}
.mrow{display:flex;gap:9px}.mrow .btn{flex:1}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.slot{border-radius:var(--r);padding:13px 6px;font-size:12.5px;font-weight:500;
  background:var(--wash);cursor:pointer;transition:.2s}
.slot.on{background:var(--blue);color:#fff}
.slot span{display:block;font-weight:400;font-size:11.5px;opacity:.7;margin-top:3px}
.modal textarea{width:100%;font:inherit;font-size:14.5px;background:var(--wash);
  border:1px solid transparent;border-radius:var(--r);padding:13px 15px;margin-bottom:20px;
  text-align:left;resize:none}
.modal textarea:focus{outline:none;background:#fff;border-color:var(--blue)}

/* ---------- footer ---------- */
.ft{border-top:1px solid var(--line);margin-top:80px;
  padding-top:34px;padding-bottom:50px}
.ft p{font-size:12.5px;color:var(--ink-3)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .cats{grid-template-columns:1fr 1fr}
  .feat{grid-template-columns:1fr}
  .dgrid{grid-template-columns:1fr}
  .claim{position:static}
  .cards2{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .jcard{grid-template-columns:44px 1fr;gap:16px}
  .jstate{grid-column:1/-1;text-align:left;margin-top:6px}
  .steps{justify-content:flex-start}
  .nlinks{display:none}
}
@media (max-width:560px){
  .cats{grid-template-columns:1fr}
  .diff{grid-template-columns:1fr}
  .rwtop{flex-direction:column;align-items:flex-start;gap:14px}
  .rwtop .r{text-align:left}
}

/* ================= CLAIM ================= */
const TICK=`<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0547FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;

 const p=P(id);
 if(p.mech==='instant'){
  ov.innerHTML=`<div class="ov" data-close><div class="modal" role="dialog" aria-modal="true">
   <div class="mi">${TICK}</div><h3>You're in</h3>

 } else if(p.mech==='booking'){

/* ================= MOTION ================= */
const RM=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
function animate(){
 const els=view.querySelectorAll('.rv');
 if(RM){els.forEach(x=>x.classList.add('in'));fills();counts();return;}
 const io=new IntersectionObserver((en,o)=>{
   en.forEach(x=>{if(x.isIntersecting){
     const d=[...view.querySelectorAll('.rv.in')].length;
     x.target.style.transitionDelay=Math.min(d*35,180)+'ms';
     x.target.classList.add('in');o.unobserve(x.target);}});
 },{threshold:.06,rootMargin:'0px 0px -40px 0px'});
 els.forEach(x=>io.observe(x));
 setTimeout(()=>{fills();counts()},260);
}
function fills(){
 view.querySelectorAll('[data-fill]').forEach(el=>{
   const w=el.dataset.fill+'%';
   if(RM){el.style.width=w;return;}
   requestAnimationFrame(()=>{el.style.width=w});
 });
}
function counts(){
 view.querySelectorAll('[data-count]').forEach(el=>{
  const t=+el.dataset.count,pre=el.dataset.prefix||'';
  if(RM){el.textContent=pre+t.toLocaleString();return;}
  const st=performance.now(),dur=1250;
  const tick=now=>{
   const k=Math.min((now-st)/dur,1),ease=1-Math.pow(1-k,3.2);
   el.textContent=pre+Math.round(t*ease).toLocaleString();
   if(k<1)requestAnimationFrame(tick);
  };requestAnimationFrame(tick);
 });
}

/* ================= ROUTER ================= */
const S={home,cat,perk:detail,mine,admin,journey,approvals,pdash,poffer};
function go(n,a){rt={n,a};view.innerHTML=(S[n]||home)(a);nav();window.scrollTo(0,0);animate();}

document.addEventListener('click',ev=>{
 const c=ev.target.closest('[data-claim]');if(c){claim(c.dataset.claim);return}
 const t=ev.target.closest('[data-toast]');if(t){toast(t.dataset.toast);return}
 const g=ev.target.closest('[data-go]');
 if(g){if(g.hasAttribute('data-close')||g.closest('[data-close]'))ov.innerHTML='';go(g.dataset.go,g.dataset.a);return}
 if(ev.target.closest('[data-close]')||ev.target.hasAttribute('data-close')){ov.innerHTML='';return}
 const r=ev.target.closest('[data-role]');
 if(r){role=r.dataset.role;
  document.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-selected',b.dataset.role===role));
  go(role==='founder'?'home':role==='hub71'?'admin':'pdash');return}
 const sl=ev.target.closest('.slot');
 if(sl){sl.parentElement.querySelectorAll('.slot').forEach(x=>x.classList.remove('on'));sl.classList.add('on');return}
 const ch=ev.target.closest('.chip');
 if(ch){ch.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));ch.classList.add('on')}
});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape')ov.innerHTML='';
 if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[data-go][role=button]')){ev.preventDefault();ev.target.click()}
});
go('home');
</script>
